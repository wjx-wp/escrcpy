name: guidepix-package

on:
  push:
    branches:
      - feature/documentation-workflow-v6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guidepix-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable corepack and pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace dependencies
        shell: pwsh
        run: |
          pnpm --filter @escrcpy/shared build
          pnpm --filter @escrcpy/adbx build
          pnpm --filter @escrcpy/unocss-preset-shades build
          pnpm --filter @escrcpy/electron-ipcx build
          pnpm --filter @escrcpy/electron-setup build

      - name: Lint packaging files
        run: >-
          pnpm exec eslint
          desktop/electron-builder.config.js
          desktop/dev-publish.yml

      - name: Build renderer and Electron main process
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter escrcpy build

      - name: Package GuidePix Windows x64
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter escrcpy build:electron -- --win --x64

      - name: Verify release names
        shell: pwsh
        run: |
          Get-ChildItem -Path desktop/dist-release -File | Select-Object Name, Length
          foreach ($name in @('GuidePix-Portable-x64.exe', 'GuidePix-Setup-x64.exe', 'GuidePix-x64.zip')) {
            if (-not (Test-Path (Join-Path 'desktop/dist-release' $name))) {
              throw "Missing GuidePix release artifact: $name"
            }
          }

      - name: Upload GuidePix Windows x64
        uses: actions/upload-artifact@v6
        with:
          name: GuidePix-1.0.0-Windows-x64
          path: |
            desktop/dist-release/GuidePix-Portable-x64.exe
            desktop/dist-release/GuidePix-Setup-x64.exe
            desktop/dist-release/GuidePix-x64.zip
            desktop/dist-release/*x64.exe.blockmap
            desktop/dist-release/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
