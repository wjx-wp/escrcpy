name: guidepix-ci

on:
  push:
    branches:
      - feature/documentation-mode
      - fix/documentation-ux-v1
      - fix/documentation-ux-handler-v2
      - fix/documentation-capture-v4
      - fix/documentation-nativeimage-v5
      - feature/documentation-workflow-v6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guidepix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable corepack and pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace dependencies
        shell: pwsh
        run: |
          pnpm --filter @escrcpy/shared build
          pnpm --filter @escrcpy/adbx build
          pnpm --filter @escrcpy/unocss-preset-shades build

      - name: Lint GuidePix changes
        shell: pwsh
        run: >-
          pnpm exec eslint
          desktop/electron/main.js
          desktop/electron/services/index.js
          desktop/electron/services/documentation/index.js
          desktop/electron/services/documentation-workflow/index.js
          desktop/electron/services/documentation-ux-native/index.js
          desktop/electron/services/documentation-ux-phone/index.js
          desktop/src/App.vue
          desktop/src/views/device/index.vue
          desktop/src/components/documentation-workbench/index.vue
          desktop/src/components/annotation-editor/fabric-compat.js
          desktop/src/components/annotation-editor/index.vue
          desktop/src/components/annotation-editor/use-editor.js
          desktop/src/components/annotation-editor/helpers/index.js
          desktop/src/components/control-bar/index.vue
          desktop/src/components/control-bar/annotate/index.vue
          desktop/src/components/control-bar/document-capture/index.vue
          desktop/src/components/control-bar/documentation/index.vue
          desktop/src/components/quick-bar/index.vue
          desktop/src/components/quick-bar/components/documentation-workbench/index.vue
          desktop/src/components/quick-bar/components/documentation-workspace/index.vue
          desktop/src/hooks/use-documentation-action/index.js
          desktop/src/hooks/use-screenshot-action/index.js
          desktop/src/store/annotation/index.js
          desktop/src/store/documentation/index.js
          desktop/src/store/documentation-workflow/index.js
          desktop/vite.config.js
          desktop/electron-builder.config.js

      - name: Guard capture path against sharp
        shell: pwsh
        run: |
          $files = @(
            'desktop/electron/services/documentation-ux-native/index.js',
            'desktop/electron/services/documentation-ux-phone/index.js'
          )
          $forbidden = Select-String -Path $files -Pattern "sharp" -SimpleMatch -Quiet
          if ($forbidden) {
            throw 'GuidePix capture must not reference sharp in the Electron main process.'
          }

      - name: Build desktop app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter escrcpy build

      - name: Assert GuidePix runtime handlers are bundled
        shell: pwsh
        run: |
          $mainBundles = Get-ChildItem -Path 'desktop/dist-electron' -Filter 'main*.js' -File
          if (-not $mainBundles) {
            throw 'Electron main bundles were not generated under desktop/dist-electron'
          }
          foreach ($pattern in @(
            'documentation-workspace-get',
            'documentation-dnd-enter',
            'documentation-capture-screen',
            'documentation-workflow-get',
            'documentation-workflow-create-variant',
            'documentation-workflow-write-compose',
            'phone-screenshot-not-created'
          )) {
            $found = Select-String -Path $mainBundles.FullName -Pattern $pattern -SimpleMatch -Quiet
            if (-not $found) {
              throw "Required GuidePix runtime code is missing from generated Electron main chunks: $pattern"
            }
          }

      - name: Assert GuidePix renderer features are bundled
        shell: pwsh
        run: |
          $rendererBundles = Get-ChildItem -Path 'desktop/dist/assets' -Filter '*.js' -File
          if (-not $rendererBundles) {
            throw 'Renderer bundles were not generated under desktop/dist/assets'
          }
          foreach ($pattern in @('GuidePix', 'CAPTURE FIRST', 'COMPOSE')) {
            $found = Select-String -Path $rendererBundles.FullName -Pattern $pattern -SimpleMatch -Quiet
            if (-not $found) {
              throw "GuidePix renderer feature is missing from generated assets: $pattern"
            }
          }
